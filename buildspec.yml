version: 0.2

env:
  variables:
    # ID Alias asli akun Anda yang sudah diverifikasi oleh AWS di log sebelumnya
    REGISTRY_ALIAS: "k8i7x3f7"
    IMAGE_REPO_NAME: "spring/product-service"
    IMAGE_TAG: "latest"

phases:
  pre_build:
    commands:
      - echo "Logging into Amazon ECR Public..."
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
  build:
    commands:
      - echo "Build started on `date`"
      - echo "Compiling Spring Boot application..."
      - mvn clean package -DskipTests
      - echo "Building the Docker image..."
      - docker build -t spring-app:latest .
      - echo "Tagging the Docker image for ECR Public..."
      - docker tag spring-app:latest public.ecr.aws/$REGISTRY_ALIAS/$IMAGE_REPO_NAME:$IMAGE_TAG
  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Pushing the Docker image to AWS ECR Public..."
      - docker push public.ecr.aws/$REGISTRY_ALIAS/$IMAGE_REPO_NAME:$IMAGE_TAG
