version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "132851953521"
    AWS_REGION: "ap-southeast-1"
    IMAGE_REPO_NAME: "spring/product-service"
    IMAGE_TAG: "latest"

phases:
  pre_build:
    commands:
      - echo "Logging into Amazon ECR Private..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

  build:
    commands:
      - echo "Build started on `date`"
      - echo "Building Docker image..."
      - docker build -t spring-app:$IMAGE_TAG .
      - echo "Tagging Docker image for ECR..."
      - docker tag spring-app:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG

  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Pushing Docker image to Amazon ECR..."
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo "Creating imagedefinitions.json..."
      - printf '[{"name":"product-service-container","imageUri":"%s"}]' "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG" > imagedefinitions.json
      - echo "Build artifacts:"
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json