name: Deploy Spring Boot to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      #################################################
      # Checkout Source
      #################################################

      - name: Checkout
        uses: actions/checkout@v4

      #################################################
      # Setup Java
      #################################################

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      #################################################
      # Build Application
      #################################################

      - name: Build Maven Project
        run: mvn clean package -DskipTests

      - name: Debug AWS Role ARN
        run: |
          echo "Length: ${#ROLE}"
          echo "$ROLE" | sed 's/./*/g'
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}

      - name: Show OIDC Token Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            console.log(payload);

      #################################################
      # Configure AWS
      #################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      #################################################
      # Login ECR
      #################################################

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      #################################################
      # Build Docker Image
      #################################################

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ vars.ECR_REPOSITORY }}:${{ github.sha }} .

      #################################################
      # Tag Docker Image
      #################################################

      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ vars.ECR_REPOSITORY }}:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      #################################################
      # Push Docker Image
      #################################################

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      #################################################
      # Download ECS Task Definition
      #################################################

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --query taskDefinition \
            > task-definition.json

      #################################################
      # Update Image
      #################################################

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      #################################################
      # Deploy ECS
      #################################################

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true